name: Buss 865 bevakning
on:
  schedule:
    # 03:00-05:59 UTC täcker svensk 04:50-05:59 både vinter och sommar.
    - cron: '*/5 3-5 * * 1-5'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Skicka en testnotis till ntfy (true/false)'
        type: boolean
        required: false
        default: true
permissions:
  contents: write
concurrency:
  group: buss-865
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera buss eller skicka test
        env:
          TRAFIKLAB_API_KEY: ${{ secrets.BUSS865NYCKEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python monitor.py
      - name: Spara status
        if: ${{ inputs.test_notification != true }}
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "Update notification state" && git push)
          fi
