name: Buss 865 bevakning
on:
  schedule:
    - cron: '*/5 3-4 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera ankomst
        env:
          DEPARTURES_URL: ${{ secrets.DEPARTURES_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py
      - name: Spara bevakningsstatus
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "Update notification state" && git push)
          fi
